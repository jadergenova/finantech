services:
  postgres:
    image: postgres:16-alpine
    container_name: finantech_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: finantech
      POSTGRES_USER: finantechadmin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finantech2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finantechadmin -d finantech"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
